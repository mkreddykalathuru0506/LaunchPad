# Local development overrides — keeps only Postgres running.
# Usage: docker compose -f docker-compose.dev.yml up -d
# Then run `npm run dev` on the host.

services:
  db:
    image: postgres:16-alpine
    container_name: launchpad-postgres
    environment:
      POSTGRES_USER: launchpad
      POSTGRES_PASSWORD: launchpad
      POSTGRES_DB: launchpad
    ports:
      - "5432:5432"
    volumes:
      - launchpad-pg-dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U launchpad -d launchpad"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  launchpad-pg-dev:
