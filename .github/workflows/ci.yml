name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# GitHub forces JS actions onto Node 24 from 2026-06-16; opt in now so the
# switch can't surprise us (checkout@v4 / setup-node@v4 are Node-24-ready).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    name: Typecheck + build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 22 = active LTS; ships npm 10, same major the lockfile is verified
          # against (see the @auth/core nodemailer override).
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Prisma generate
        run: npx prisma generate

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        env:
          DATABASE_URL: "postgresql://x:x@127.0.0.1:5432/x?schema=public"
          NEXTAUTH_URL: "http://localhost:3000"
          NEXTAUTH_SECRET: "build-only-not-a-real-secret-build-only"
          ENCRYPTION_KEY: "build-only-not-a-real-key-build-only-3232"
        run: npm run build
